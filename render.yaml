# ===================================================
# Render.com Blueprint (Infrastructure-as-Code)
# Deploys BloodChain Backend + Managed PostgreSQL Database
# ===================================================

services:
  # -------------------------------------------------
  # 1. BloodChain Backend Web Service (Django + ML)
  # -------------------------------------------------
  - type: web
    name: bloodchain-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: bloodchain-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        value: bloodchain-95960
      - key: FIREBASE_API_KEY
        value: AIzaSyDbMwrUoDEqMw_X4Rm_ss_bAzxRqdN1GuU
      - key: FIREBASE_AUTH_DOMAIN
        value: bloodchain-95960.firebaseapp.com
      - key: FIREBASE_DATABASE_URL
        value: https://bloodchain-95960-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: FIREBASE_STORAGE_BUCKET
        value: bloodchain-95960.firebasestorage.app
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "836624051781"

# -------------------------------------------------
# 2. Render Managed PostgreSQL Database
# -------------------------------------------------
databases:
  - name: bloodchain-db
    region: singapore
    plan: free
    databaseName: bloodchain
    user: bloodchain
